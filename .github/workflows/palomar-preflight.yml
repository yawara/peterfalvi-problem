name: Palomar preflight
run-name: Palomar preflight for ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

# This runs mechanical verification only; it does not submit or register a result.
jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@a59f25bd8a66bf6faf3a4f4260d412989c0185ea
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: a59f25bd8a66bf6faf3a4f4260d412989c0185ea
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"comparator_config_path":"comparator.json",
         "formalization_metadata_path":"formalization.yaml",
         "authorization_relationship":"I am a responsible author or maintainer"}
