name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the metadata-check dependencies
        run: python3 -m pip install -r requirements-palomar.txt
      - name: Check metadata, build, lint and axioms
        run: python3 scripts/check.py
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-logs
          path: .audit/

  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
      - name: Prepare the pinned Comparator sandbox on the hosted runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev meson ninja-build pkg-config
          mkdir -p .cache/palomar-comparator/bin
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/PalomarRegistry/PalomarSubmission/a59f25bd8a66bf6faf3a4f4260d412989c0185ea/scripts/install_bwrap.sh \
            --output .cache/palomar-comparator/install_bwrap.sh
          echo 'c290df6cebdf1cb26edb69ed4164d9551062bfeb65243b93d1d1d3b77eac0a35  .cache/palomar-comparator/install_bwrap.sh' | sha256sum --check
          bash .cache/palomar-comparator/install_bwrap.sh "$GITHUB_WORKSPACE/.cache/palomar-comparator/bin"
          echo "COMPARATOR_BWRAP=$GITHUB_WORKSPACE/.cache/palomar-comparator/bin/bwrap" >> "$GITHUB_ENV"
      - name: Compare the statements and replay the proofs with Lean, NanoDa and con-ron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit
          scripts/verify-comparator.sh 2>&1 | tee .audit/comparator.log
      - name: Keep the comparison log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparator-log
          path: .audit/comparator.log
